<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transit evolution</title>
  </head>
  <body class="grid h-dvh grid-rows-[auto_1fr_auto] bg-white text-sm text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
    <header class="flex flex-wrap items-center gap-2 border-b border-neutral-200 px-3 py-2 dark:border-neutral-800">
      <a href="./" class="btn">&larr; All maps</a>
      <select id="city" class="field" aria-label="Map"></select>
      <div class="flex gap-1" role="group" aria-label="Layout">
        <button id="geo" class="btn" aria-pressed="true">Geographic</button>
        <button id="sch" class="btn" aria-pressed="false">Schematic</button>
      </div>
      <span id="groups" class="flex flex-wrap items-center gap-x-4 gap-y-1 px-1"></span>
    </header>
    <canvas id="map" class="block h-full min-h-0 w-full touch-none bg-[#faf8f4]"></canvas>
    <footer class="flex flex-wrap items-center gap-3 border-t border-neutral-200 px-3 py-2 dark:border-neutral-800">
      <button id="play" class="btn w-20">Play</button>
      <span id="year" class="min-w-[4ch] text-3xl font-semibold tabular-nums"></span>
      <input id="slider" type="range" step="1" aria-label="Year" class="flex-1 accent-neutral-900 dark:accent-neutral-100" />
      <span id="badges" class="basis-full text-xs text-neutral-500 dark:text-neutral-400"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
