<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transit evolution</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
      header, footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; background: #faf8f4; }
      button[aria-pressed="true"] { background: #222; color: #fff; }
      #year { font-size: 28px; font-weight: 600; min-width: 4ch; font-variant-numeric: tabular-nums; }
      #badges { font-size: 12px; color: #777; flex-basis: 100%; }
      label { white-space: nowrap; }
    </style>
  </head>
  <body>
    <header>
      <select id="city"></select>
      <button id="geo" aria-pressed="true">Geographic</button>
      <button id="sch" aria-pressed="false">Schematic</button>
      <span id="groups"></span>
    </header>
    <canvas id="map"></canvas>
    <footer>
      <button id="play">Play</button>
      <span id="year"></span>
      <input id="slider" type="range" step="1" style="flex: 1" />
      <span id="badges"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
