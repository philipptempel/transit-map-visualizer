<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Transit evolution</title>
    <meta name="description" content="Animated maps of how public transport networks were built, extended and cut back over the decades." />
    <script>
      // Follow the system theme; set before first paint to avoid a light flash.
      const dark = matchMedia("(prefers-color-scheme: dark)");
      const apply = () => document.documentElement.classList.toggle("dark", dark.matches);
      apply();
      dark.addEventListener("change", apply);
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/pages/landing.tsx"></script>
  </body>
</html>
